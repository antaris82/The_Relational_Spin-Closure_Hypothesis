name: Unpack Aristotle archive into repository root

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-aristotle.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and unpack archive root into repository root
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='fb7530c8-3dc3-41f1-bc9f-c72099ca8b9f-aristotle.tar.gz'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          test -f "$ARCHIVE"

          python3 - <<'PY'
          import pathlib, tarfile, sys

          archive = pathlib.Path('fb7530c8-3dc3-41f1-bc9f-c72099ca8b9f-aristotle.tar.gz')
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('archive is empty')
              for m in members:
                  p = pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe archive path: {m.name!r}')
          print(f'validated {len(members)} archive entries')
          PY

          tar -xzf "$ARCHIVE" -C "$TMP"

          mapfile -t TOP < <(find "$TMP" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [[ ${#TOP[@]} -eq 1 && -d "$TMP/${TOP[0]}" ]]; then
            SRC="$TMP/${TOP[0]}"
            echo "Stripping single archive root directory: ${TOP[0]}"
          else
            SRC="$TMP"
            echo "Archive has no single directory wrapper; using archive root directly"
          fi

          # Never copy an embedded Git database from an archive.
          rm -rf "$SRC/.git"

          # Copy the archive-root contents into the repository root.
          cp -a "$SRC"/. ./

          # The archive has now been replaced by its extracted repository contents.
          rm -f "$ARCHIVE"

          # Self-clean this one-shot workflow so main remains the unpacked project root.
          rm -f .github/workflows/unpack-aristotle.yml
          rmdir --ignore-fail-on-non-empty .github/workflows 2>/dev/null || true
          rmdir --ignore-fail-on-non-empty .github 2>/dev/null || true

      - name: Commit unpacked repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Unpack Aristotle repository into main root'
          git push origin HEAD:main
