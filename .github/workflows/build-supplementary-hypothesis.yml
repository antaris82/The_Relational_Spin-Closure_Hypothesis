name: Build supplementary hypothesis paper

on:
  push:
    branches:
      - main
    paths:
      - 'Supplementary/Relational_Spin_Closure_Hypothesis.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile hypothesis paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Relational_Spin_Closure_Hypothesis.tex
          working_directory: Supplementary
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit compiled PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Supplementary/Relational_Spin_Closure_Hypothesis.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF is unchanged."
            exit 0
          fi
          git commit -m "Build updated hypothesis paper PDF"
          git push
