name: Build supplementary hypothesis paper

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-supplementary-hypothesis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Diagnose staged payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('.hypothesis-payload/part03').read_bytes()
          print('part03_len', len(p))
          print('part03_sha256', hashlib.sha256(p).hexdigest())
          for i in range(0, len(p), 1000):
              b = p[i:i+1000]
              print(f'BLOCK {i//1000:02d} {i:05d}-{i+len(b)-1:05d} {hashlib.sha256(b).hexdigest()}')
          PY
          cat .hypothesis-payload/part* | base64 -d > Supplementary/Relational_Spin_Closure_Hypothesis.tex
          sha256sum Supplementary/Relational_Spin_Closure_Hypothesis.tex

      - name: Verify exact revised source
        shell: bash
        run: |
          echo "5843e2869af45775c19eab90814f3aab70705c6199d93d0c0d37f2ddb2b8ea40  Supplementary/Relational_Spin_Closure_Hypothesis.tex" | sha256sum -c -

      - name: Compile hypothesis paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Relational_Spin_Closure_Hypothesis.tex
          working_directory: Supplementary
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit synchronized source and PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Supplementary/Relational_Spin_Closure_Hypothesis.tex Supplementary/Relational_Spin_Closure_Hypothesis.pdf
          if git diff --cached --quiet; then
            echo "Hypothesis paper is unchanged."
            exit 0
          fi
          git commit -m "Update hypothesis paper after Paper I"
          git push
